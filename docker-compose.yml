version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: car-marketplace-db
    environment:
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: car_marketplace
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev_user -d car_marketplace"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
