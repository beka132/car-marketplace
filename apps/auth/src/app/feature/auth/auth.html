<div class="auth">
  <section class="auth__hero">
    <div class="auth__hero-content">
      <p class="auth__hero-tag">Premium Marketplace</p>
      <h1 class="auth__hero-title">
        Your next car <br />
        is waiting for you
      </h1>
      <p class="auth__hero-description">
        Access 12,000+ premium vehicles, save your <br />
        favorites, and get AI-powered recommendations.
      </p>
    </div>
  </section>
  <section class="auth__mode">
    <h2 class="auth__title">{{ title() }}</h2>
    <p class="auth__subtitle">{{ subtitle() }}</p>

    <div class="auth__tabs">
      <button
        type="button"
        class="auth__tab"
        [class.auth__tab--active]="authMode() === 'login'"
        (click)="setMode('login')"
      >
        Sign In
      </button>
      <button
        type="button"
        class="auth__tab"
        [class.auth__tab--active]="authMode() === 'register'"
        (click)="setMode('register')"
      >
        Register
      </button>
    </div>

    @if(authMode() === 'login') {
      <cm-login></cm-login>
    }

    <div class="auth__divider">
      <span>or continue with</span>
    </div>

    <div class="auth__socials">
      <cm-button [label]="'Google'" [variant]="'outline'" [fullWidth]="true" />
      <cm-button [label]="'Apple'" [variant]="'outline'" [fullWidth]="true" />
    </div>

    <p class="auth__switch">
      {{ switchPrompt() }}
      <button type="button" class="auth__switch-link" (click)="toggleMode()">{{ switchLabel() }}</button>
    </p>
  </section>
</div>
